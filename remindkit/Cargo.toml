[package]
name = "remindkit"
version = "0.1.0"
edition = "2021"
description = "iCloud Reminders client (CloudKit Web Services) for Leporello — no GTK dependency"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
pbkdf2 = "0.12"
num-bigint = "0.4"
rand = "0.8"
flate2 = "1"
prost = "0.13"
log = "0.4"
similar = "2"
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
iana-time-zone = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rpassword = "7"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
